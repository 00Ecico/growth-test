<head>

<style>

  --sage:#84A59D; --sage-deep:#52756D; --sage-tint:#E3ECE9;
  --coral-tint:#F5E3DE; --coral:#C96F5F;

  --shadow-s:0 2px 8px rgba(27,25,22,.05); --shadow-m:0 8px 24px rgba(27,25,22,.07);

html{scroll-behavior:smooth}

.hero{padding:72px 0 40px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:16px;font-weight:500;cursor:pointer;border:none;border-radius:14px;padding:15px 26px;transition:transform .18s,box-shadow .18s,background .18s;text-decoration:none;line-height:1.4}

.btn-primary{background:var(--sage-deep);color:#FDFBF7;box-shadow:var(--shadow-m)}

.btn-soft{background:var(--sage-tint);color:var(--sage-deep)}
.btn-sm{padding:10px 18px;font-size:14px;border-radius:11px}
.notice{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 22px;box-shadow:var(--shadow-s);margin:34px 0}

.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:38px;gap:10px}
.link-btn{background:none;border:none;font-family:var(--sans);font-size:14px;color:var(--ink-3);cursor:pointer;padding:10px 4px;text-decoration:underline;text-underline-offset:4px}
.link-btn:hover{color:var(--ink)}
.autosave{font-size:12px;color:var(--ink-3);text-align:center;margin-top:26px}

.inter{padding:90px 0;text-align:center}
.inter .big{font-family:var(--serif);font-size:clamp(24px,6vw,32px);font-weight:600;line-height:1.5;margin:18px 0 14px}
.inter .num{font-family:var(--serif);font-size:15px;color:var(--sage-deep);letter-spacing:.2em}
/* ---------- result ---------- */
.res-hero{padding:56px 0 10px}
.res-hero .date{font-size:13px;color:var(--ink-3);letter-spacing:.08em;margin-top:10px}
.res-sec{margin:44px 0}
.res-sec h2{margin-bottom:14px}
/* 揭示卡 */
.type-card{
  background:var(--paper-2);border:1px solid var(--line);border-radius:26px;
  padding:46px 30px 38px;box-shadow:var(--shadow-m);text-align:center;

}
.type-card::before{content:"";position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:340px;height:340px;border-radius:50%;background:var(--tc,#84A59D);opacity:.12;pointer-events:none}
.type-en{font-family:var(--serif);font-size:13px;letter-spacing:.34em;color:var(--ink-3);text-transform:uppercase}
.type-motif{width:88px;height:88px;border-radius:50%;background:var(--tc,#84A59D);margin:22px auto 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(27,25,22,.14)}
.type-motif svg{width:44px;height:44px;stroke:#FDFBF7;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.type-name{font-family:var(--serif);font-size:clamp(38px,9vw,52px);font-weight:700;line-height:1.2;letter-spacing:.04em}
.type-sub{font-size:15px;color:var(--ink-2);margin-top:8px;letter-spacing:.06em}
.type-attach{display:inline-block;margin-top:16px;font-size:12.5px;letter-spacing:.1em;color:var(--sage-deep);background:var(--sage-tint);border-radius:99px;padding:5px 16px;font-weight:700}
.type-motto{font-family:var(--serif);font-size:19px;color:var(--ink);margin-top:22px;line-height:1.8}
.type-strength{margin-top:22px;font-size:13px;color:var(--ink-3)}
.type-strength b{font-family:var(--serif);font-size:30px;color:var(--tc,#52756D);font-weight:600;vertical-align:-4px}
.type-base{margin-top:12px;font-size:13.5px;color:var(--ink-2)}
.type-flat{margin-top:14px;font-size:13px;color:var(--ink-3);background:var(--line-2);border-radius:10px;padding:10px 14px;display:inline-block}
/* 场景网格 */
.scene-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media(max-width:560px){.scene-grid{grid-template-columns:1fr}}
.scene-card{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow-s)}
.scene-card h4{font-size:14px;color:var(--tc,var(--sage-deep));letter-spacing:.08em;font-weight:700;margin-bottom:8px}
.scene-card p{font-size:14.5px;color:var(--ink-2);line-height:1.85}
.scene-card .mech{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2);font-size:12.5px;color:var(--sage-deep);line-height:1.8}
.scene-card .mech b{font-weight:700}
.attach-badge{display:inline-block;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--sage-deep);background:var(--sage-tint);border-radius:12px;padding:8px 18px;margin:10px 0 12px}
.dist-analysis{font-size:14.5px;color:var(--ink-2);line-height:1.95;margin-top:14px}
.dist-analysis+.dist-analysis{margin-top:10px}
/* 分布图 */
.dist-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media(max-width:560px){.dist-wrap{grid-template-columns:1fr}}
.dist-card{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-s)}
.dist-card h4{font-size:14px;letter-spacing:.08em;color:var(--ink-2);margin-bottom:4px}
.dist-card .small{margin-bottom:12px}
.dbar{display:flex;align-items:center;gap:10px;padding:7px 0}
.dbar-name{width:56px;flex:none;font-size:13px;color:var(--ink-2)}
.dbar-track{flex:1;height:10px;background:var(--line-2);border-radius:99px;overflow:hidden}
.dbar-fill{display:block;height:100%;border-radius:99px;background:var(--sage);transition:width .9s cubic-bezier(.22,1,.36,1)}
.dbar-val{width:38px;flex:none;font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
/* 力量与代价 */
.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media(max-width:560px){.pc-grid{grid-template-columns:1fr}}
.pc-card{border-radius:16px;padding:22px;box-shadow:var(--shadow-s)}
.pc-card.power{background:var(--sage-tint)}
.pc-card.cost{background:var(--coral-tint)}
.pc-card h4{font-size:14px;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.pc-card.power h4{color:var(--sage-deep)} .pc-card.cost h4{color:var(--coral)}
.pc-card p{font-size:14.5px;color:var(--ink-2);line-height:1.85}
/* 建议 */
.advice-card{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow-s)}
.advice-card li{padding:10px 0 10px 26px;position:relative;color:var(--ink-2);font-size:15px;line-height:1.85;border-bottom:1px dashed var(--line-2);list-style:none}
.advice-card li:last-child{border-bottom:none}
.advice-card li::before{content:"";position:absolute;left:4px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--tc,var(--sage))}
/* 反馈 */
.fb-row{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;align-items:center;justify-content:center}
.fb-label{font-size:13px;color:var(--ink-3);width:100%;margin-bottom:2px;text-align:center}
.fb-btn{font-family:var(--sans);font-size:13.5px;padding:9px 18px;border-radius:99px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink-2);transition:all .15s}
.fb-btn:hover{border-color:var(--ink-3)}
.fb-btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.alt-type{margin-top:16px;background:var(--paper-2);border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center;display:none}
.alt-type.show{display:block;animation:fadeIn .3s ease}
/* 维度剖面 */
.dim-mini{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-s)}

.bar-row:last-child{border-bottom:none}
.bar-name{width:118px;flex:none;font-size:14px;color:var(--ink-2)}
.bar-track{flex:1;height:10px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sage),var(--sage-deep))}
.bar-fill.lv1{width:14%}.bar-fill.lv2{width:32%}.bar-fill.lv3{width:52%}.bar-fill.lv4{width:74%}.bar-fill.lv5{width:94%}
.bar-fill.low{background:var(--ink-3);opacity:.5}
.bar-lv{width:44px;flex:none;font-size:13px;font-weight:700;color:var(--sage-deep);text-align:right}
.dim-alt{margin-top:14px;padding:14px 16px;background:var(--coral-tint);border-radius:12px;font-size:13.5px;color:var(--ink-2);line-height:1.8}
.dim-alt b{color:var(--coral);font-weight:700}
/* 环境回顾 */
.env-card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-s);margin-bottom:14px}
.env-quote{font-family:var(--serif);font-size:17px;line-height:1.9;padding:4px 0 10px}
/* topics */
.topics{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.topic-btn{font-family:var(--sans);font-size:14.5px;padding:12px 20px;border-radius:99px;cursor:pointer;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);transition:all .16s;text-align:left}
.topic-btn:hover{border-color:var(--sage-deep);color:var(--sage-deep);transform:translateY(-2px);box-shadow:var(--shadow-s)}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;margin:40px 0 20px}
.footer-note{border-top:1px solid var(--line);margin-top:50px;padding:26px 0 60px;font-size:13px;color:var(--ink-3);line-height:1.9}
/* deep */
.deep-block{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow-s);margin-bottom:16px}
.deep-block h3{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.deep-block h3 .n{font-family:var(--serif);font-size:14px;color:var(--sage-deep);letter-spacing:.1em}
.deep-block p{color:var(--ink-2);font-size:15px;line-height:1.95}
.deep-block p+p{margin-top:10px}
.deep-block ul{list-style:none}
.deep-block li{padding:10px 0 10px 24px;position:relative;color:var(--ink-2);font-size:15px;line-height:1.8;border-bottom:1px dashed var(--line-2)}
.deep-block li:last-child{border-bottom:none}
.deep-block li::before{content:"";position:absolute;left:4px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--sage)}
.deep-quote{font-family:var(--serif);font-size:16px;color:var(--ink);background:var(--sage-tint);border-radius:12px;padding:14px 18px;margin:10px 0}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font-size:14px;padding:12px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:all .3s ease;z-index:99;box-shadow:var(--shadow-m);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media print{
  body{background:#fff}
  .no-print,.fb-row,.res-actions,.topics,#toast,.alt-type{display:none!important}
  .type-card,.env-card,.deep-block,.scene-card,.dist-card{box-shadow:none;break-inside:avoid}
  .bar-fill,.dbar-fill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
/* ================= 基础 ================= */
const STORE_KEY = "wodechengzhang.v2";
const FAM = [
  {v:1,t:"完全没有"},{v:2,t:"很少有"},{v:3,t:"记不清 / 说不清"},{v:4,t:"有些熟悉"},{v:5,t:"非常熟悉"}
];
const LIKERT = [
  {v:1,t:"完全不符合"},{v:2,t:"不太符合"},{v:3,t:"说不清 / 偶尔"},{v:4,t:"比较符合"},{v:5,t:"完全符合"}
];
const LV_NAMES = ["低","中低","中","中高","高"];
function lvOf(s){ return s<2.2?0 : s<2.8?1 : s<3.4?2 : s<4.0?3 : 4; }

/* ================= 第一部分：成长环境再认（16题，不参与定型） ================= */
const ENV_CATS = {
  recognition:{name:"情感与认可", label:"「认可」似乎常常和「表现」绑在一起",
    desc:"你描述的成长环境里，家人对你的态度可能较多地随你的表现而变化。在这样的环境中长大的人，有时会把「被爱」理解成一件需要通过努力去维持的事。"},
  boundary:{name:"边界", label:"「你的事」和「家里的事」之间的界限比较模糊",
    desc:"在你的描述中，家人可能较多地参与或接管本该属于你的决定和空间。在这样的环境里，「说不」可能是一件需要付出代价的事。"},
  emotion:{name:"情绪责任", label:"家里的情绪不太容易预测，需要你察言观色",
    desc:"你描述的成长环境中，你似乎很早就学会了观察脸色、预判气氛，并据此调整自己。这种「雷达」在当时可能是保护自己的方式。"},
  conflict:{name:"冲突", label:"冲突很少被真正谈开",
    desc:"在你描述的家里，矛盾似乎更多是冷处理、不了了之，或以某一方让步告终。在这样的环境中，「表达不同意见」可能是一件有风险的事。"},
  role:{name:"角色", label:"你比同龄人更早承担了情绪或家庭责任",
    desc:"你描述的成长经历中，「懂事」「不添麻烦」「照顾家人感受」可能是你很早就熟悉的角色。在这样的环境里，自己的需求常常是最后被考虑的那个。"}

  });
  const scores = {};
  dims.forEach(d=>scores[d]=Math.min(5, base[d]+boost[d]));
  return scores;
}
function computeProfile(){
  const scores = dimScores();
  const sorted = Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);
  const d1 = sorted[0], d2 = sorted[1];
  // 矛盾者规则：独立 与 焦虑系维度同时偏高
  let typeKey;
  if(d1==="independence" && ANXIOUS_DIMS.includes(d2) && scores[d2]>=3.2) typeKey="contra";
  else if(ANXIOUS_DIMS.includes(d1) && d2==="independence" && scores[d2]>=Math.max(3.2, scores[d1]-0.4)) typeKey="contra";
  else typeKey = DIM2TYPE[d1];
  if(S.typeOverride) typeKey = S.typeOverride;
  // 备选类型
  let runnerKey = typeKey==="contra" ? DIM2TYPE[d1] : (DIM2TYPE[d2]!==typeKey ? DIM2TYPE[d2] : DIM2TYPE[sorted[2]]);
  if(runnerKey===typeKey) runnerKey = "indep";
  // 强度
  const rest = sorted.slice(1).map(k=>scores[k]);
  const avgRest = rest.reduce((a,b)=>a+b,0)/rest.length;
  const gap12 = scores[d1]-scores[d2];
  let strength = Math.round(60 + (scores[d1]-avgRest)*16 + gap12*6);
  strength = Math.max(55, Math.min(97, strength));
  const flat = gap12 < 0.35;
  // 底色
  let baseDim = null;
  if(typeKey!=="contra" && DIM2TYPE[d2]!==typeKey) baseDim = d2;
  // 依恋分布
  const m = (...ds)=>ds.reduce((a,d)=>a+scores[d],0)/ds.length;
  const anx = m("monitor","validation","criticism","needs");
  const avo = m("independence","control");
  const fear = Math.min(anx,avo)*0.65 + m("conflict","boundary")*0.35;
  const secure = Math.max(1, 5.4 - Math.max(anx,avo,fear));
  const pct = v=>Math.max(4, Math.min(100, Math.round((v-1)/4*100)));
  const attach = { "安全":pct(secure), "焦虑":pct(anx), "疏离":pct(avo), "恐惧":pct(fear) };
  // 创伤反应 4F
  const fawn = m("conflict","boundary","monitor"), flight = scores.independence,
        freeze = m("criticism","needs"), fight = scores.control;
  const sum4 = fawn+flight+freeze+fight;
  const fff = { "讨好":Math.round(fawn/sum4*100), "逃离":Math.round(flight/sum4*100), "僵住":Math.round(freeze/sum4*100), "对抗":Math.round(fight/sum4*100) };
  // 成长环境
  const env = {};
  for(const k in ENV_CATS){
    const vals = PART1.questions.filter(q=>q.cat===k).map(q=>S.answers[q.id]).filter(v=>v!==undefined);
    env[k] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  }
  return {scores, sorted, typeKey, runnerKey, strength, flat, baseDim, attach, fff, env};
}
function computeAndFinish(){ S.finished=true; save(); go("results"); }

function setTypeFb(v){ S.feedback.type=v; save(); renderResults(); window.scrollTo({top:0}); }
function switchType(){ S.typeOverride = computeProfile().runnerKey; S.feedback.type="part"; save(); renderResults(); window.scrollTo({top:0}); toast("已切换为更适合你的类型"); }
function restart(){ if(confirm("确定要清空所有回答并重新开始吗？")){ S=fresh(); save(); go("intro"); } }

/* ================= 深入探索 ================= */
function startDeep(id){ S.deep={topic:id,qIdx:0,answers:{}}; go("deep"); }
function renderDeepQuiz(){
  const t = DEEP_TOPICS.find(x=>x.id===S.deep.topic);
  const q = t.questions[S.deep.qIdx];
  const sel = S.deep.answers[S.deep.qIdx];
  const pct = Math.round(S.deep.qIdx/t.questions.length*100);
  $app.innerHTML = `
  <div class="screen active">
    <div class="q-top"><div class="wrap">
      <div class="q-top-row"><span class="q-stage">深入探索</span><span class="q-count">第 ${S.deep.qIdx+1} / ${t.questions.length} 题</span></div>
      <div class="progress"><i style="width:${pct}%"></i></div>

      <div class="q-card" id="qcard">

        <div class="q-nav">

}
function deepAnswer(v){
  S.deep.answers[S.deep.qIdx]=v; save();
  const card=document.getElementById("qcard"); if(card) card.classList.add("leaving");
  setTimeout(()=>{
    const t=DEEP_TOPICS.find(x=>x.id===S.deep.topic);
    if(S.deep.qIdx<t.questions.length-1){ S.deep.qIdx++; go("deep"); }
    else go("deepResult");
  },200);
}
function deepPrev(){ if(S.deep.qIdx>0){ S.deep.qIdx--; go("deep"); } }
function renderDeepResult(){
  const t = DEEP_TOPICS.find(x=>x.id===S.deep.topic);
  const vals = Object.values(S.deep.answers);
  const avg = vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  const lv = lvOf(avg);
  const top = t.questions.map((q,i)=>({q,v:S.deep.answers[i]||0})).sort((a,b)=>b.v-a.v).filter(x=>x.v>=4).slice(0,3);
  $app.innerHTML = `

    <div class="res-hero" style="padding-bottom:6px">

          :`<p>从你的回答来看，这个主题与你的呼应不算强烈（自评倾向：${LV_NAMES[lv]}）。${top.length?"不过，以下几句你还是觉得比较像自己：":"这可能说明它并不是你目前最核心的议题。"}</p>`}

/* ================= 分享图片 ================= */
function shareImage(){
  const R = computeProfile();
  const T = TYPES[R.typeKey];
  const attachKeyMap = { "安全":"secure", "焦虑":"anx", "疏离":"avo", "恐惧":"fear" };
  const aMax = Object.keys(R.attach).sort((a,b)=>R.attach[b]-R.attach[a])[0];
  const aBadge = ATTACH_A[attachKeyMap[aMax]].badge;
  const c = document.createElement("canvas");
  const W=1080,H=1440; c.width=W; c.height=H;
  const x = c.getContext("2d");
  x.fillStyle="#F7F2EA"; x.fillRect(0,0,W,H);
  // 顶部柔光
  const g = x.createRadialGradient(W/2,300,40,W/2,300,420);
  g.addColorStop(0,T.color+"33"); g.addColorStop(1,"rgba(0,0,0,0)");
  x.fillStyle=g; x.fillRect(0,0,W,760);
  x.textAlign="center";
  x.font="600 30px 'Noto Sans SC', sans-serif"; x.fillStyle="#9C9388";
  x.fillText("自 我 探 索 · 成 长 适 应 画 像", W/2, 120);
  // 类型徽章
  x.beginPath(); x.arc(W/2, 320, 110, 0, Math.PI*2); x.fillStyle=T.color; x.fill();
  x.font="700 92px 'Noto Serif SC', serif"; x.fillStyle="#FDFBF7";
  x.fillText(T.name[0], W/2, 354);
  // 类型名
  x.font="700 110px 'Noto Serif SC', serif"; x.fillStyle="#1B1916";
  x.fillText(T.name, W/2, 540);
  x.font="400 40px 'Noto Sans SC', sans-serif"; x.fillStyle="#6B6359";
  x.fillText(T.sub+" · "+T.attach, W/2, 610);
  x.font="500 42px 'Noto Serif SC', serif"; x.fillStyle=T.color;
  x.fillText("「"+T.motto+"」", W/2, 706);
  x.font="400 30px 'Noto Sans SC', sans-serif"; x.fillStyle="#9C9388";
  x.fillText(aBadge+" · 主导倾向强度 "+R.strength+" / 100", W/2, 768);
  // 分隔线
  x.fillStyle="#84A59D"; x.fillRect(140, 850, W-280, 3);
  // 4F 分布
  x.font="500 30px 'Noto Sans SC', sans-serif"; x.fillStyle="#6B6359";
  x.fillText("创伤反应分布", W/2, 916);
  const keys = Object.keys(R.fff);
  let y = 960;
  keys.forEach(k=>{
    x.textAlign="left";
    x.font="400 30px 'Noto Sans SC', sans-serif"; x.fillStyle="#1B1916";
    x.fillText(k, 160, y+26);
    x.fillStyle="#EFEAE0"; rr(x, 290, y, 560, 26, 13); x.fill();
    x.fillStyle=T.color; rr(x, 290, y, Math.max(20, 560*R.fff[k]/100), 26, 13); x.fill();
    x.textAlign="right"; x.font="700 28px 'Noto Sans SC', sans-serif"; x.fillStyle="#6B6359";
    x.fillText(R.fff[k]+"%", 930, y+26);
    x.textAlign="center";
    y += 66;
  });
  // 底部
  x.font="400 26px 'Noto Sans SC', sans-serif"; x.fillStyle="#9C9388";
  x.fillText(new Date().toLocaleDateString("zh-CN"), W/2, 1300);
  x.fillText("本画像仅为自我探索参考，不构成任何诊断", W/2, 1348);
  x.font="400 26px 'Noto Serif SC', serif"; x.fillStyle="#52756D";
  x.fillText("「我不是在找谁是坏人，我是在开始理解自己。」", W/2, 1400);
  c.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download="我的类型画像-"+T.name+".png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  });
  toast("画像图片已生成");
}
function rr(x,px,py,w,h,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+w,py,px+w,py+h,r); x.arcTo(px+w,py+h,px,py+h,r); x.arcTo(px,py+h,px,py,r); x.arcTo(px,py,px+w,py,r); x.closePath(); }

render();
